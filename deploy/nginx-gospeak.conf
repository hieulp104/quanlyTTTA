# Nginx trên server cho GoSpeak — chép vào /etc/nginx/sites-available/gospeak (xem deploy/README.md).
# Chỉ viết phần HTTP; chạy certbot --nginx sau đó, certbot tự thêm HTTPS và chuyển http → https.

# Web: abcd.io.vn → app (docker, 127.0.0.1:8120)
server {
    listen 80;
    listen [::]:80;
    server_name abcd.io.vn;

    client_max_body_size 20m;   # nhập file Excel danh sách học viên, file đề

    location / {
        proxy_pass http://127.0.0.1:8120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Gõ www thì chuyển về tên miền chính
server {
    listen 80;
    listen [::]:80;
    server_name www.abcd.io.vn;
    return 301 https://abcd.io.vn$request_uri;
}

# File ghi âm, ảnh vở, ảnh câu hỏi: files.abcd.io.vn → MinIO (docker, 127.0.0.1:8121)
# Trình duyệt đọc/ghi thẳng bằng URL có chữ ký S3, chữ ký tính theo Host nên phải giữ nguyên Host.
server {
    listen 80;
    listen [::]:80;
    server_name files.abcd.io.vn;

    client_max_body_size 50m;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8121;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
